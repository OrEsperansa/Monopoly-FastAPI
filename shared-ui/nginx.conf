server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    location /test-runner/ {
        set $checkpoint_runner http://test-runner:9000;
        rewrite ^/test-runner/(.*)$ /$1 break;
        proxy_pass $checkpoint_runner;
        proxy_http_version 1.1;
        proxy_read_timeout 95s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
